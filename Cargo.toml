[workspace]
members = ["crates/halo_map", "crates/halo_bridge", "crates/halo_sim"]

[package]
name = "halo_rt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Halo: Combat Evolved maps rendered with Bevy Solari ray tracing and DLSS"

[features]
default = []
# NVIDIA DLSS (Ray Reconstruction denoising + upscaling). Requires the DLSS SDK,
# Vulkan SDK and clang at build time — see README.md.
dlss = ["bevy/dlss", "bevy_solarik/dlss"]
# The game and the Rust simulation inside the executable, which then plays:
# OpenCE's halo.exe and SDL3.dll, the 32-bit halo_sim.dll and (with dlss)
# the DLSS runtime, built first (build.rs; tools/package.py builds it all).
bundle = []

[dependencies]
halo_map = { path = "crates/halo_map" }
halo_bridge = { path = "crates/halo_bridge" }
bevy = { version = "=0.20.0", features = ["https", "free_camera"] }
# Solarik, a fork of bevy_solari (glass, alpha-masked foliage, point and spot
# lights, sky lighting, a reference pathtracer that keeps accumulating), as a
# sibling checkout of https://github.com/AlrikOlson/bevy_solarik
bevy_solarik = { path = "../bevy_solarik" }
argh = "0.1.12"

[dev-dependencies]
# examples/solari_demo.rs
chacha20 = { version = "0.10.0", default-features = false, features = ["rng"] }
rand = "0.10.0"

# Solarik's forks of Bevy's renderer and wgpu, which it needs Bevy's own
# crates to use too (a dependency's patches aren't inherited)
[patch.crates-io]
bevy_render = { path = "../bevy_solarik/vendor/bevy_render" }
bevy_pbr = { path = "../bevy_solarik/vendor/bevy_pbr" }
wgpu-core = { path = "../bevy_solarik/vendor/wgpu-core" }
wgpu-hal = { path = "../bevy_solarik/vendor/wgpu-hal" }

# Fast-ish iteration: light optimization for our code, full optimization for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
